name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        # Node 22 LTS — Node 20 actions deprecated, GH Actions переходит на 24
        # с июня 2026. 22 — текущий LTS до апреля 2027, безопасный выбор.
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Tests
        run: npm test -- --run

      - name: Build
        run: npm run build
